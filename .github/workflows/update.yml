name: Actualitza preus i publica

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 10-13 * * *"
    - cron: "17 21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: spot-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Descarrega preus d'OMIE (avui i demà)
        id: fetch
        run: python3 scripts/fetch_omie.py

      - name: Desa les dades al repositori
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Preus SPOT $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
